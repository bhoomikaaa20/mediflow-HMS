<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b73"/>
    </marker>
  </defs>
  <rect width="1200" height="430" rx="16" fill="#f5f9f8"/>
  <text x="600" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#1d2b33">Patient Journey — one OP visit, four roles</text>

  <!-- Step cards -->
  <g font-size="15" fill="#33434b">
    <!-- 1 Reception -->
    <rect x="40" y="80" width="250" height="230" rx="14" fill="#ffffff" stroke="#d6e4e0"/>
    <rect x="40" y="80" width="250" height="52" rx="14" fill="#2f9e85"/><rect x="40" y="118" width="250" height="14" fill="#2f9e85"/>
    <text x="165" y="113" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">① Receptionist</text>
    <text x="60" y="162">• Register / look up by phone</text>
    <text x="60" y="188">• Auto patient ID (P001…)</text>
    <text x="60" y="214">• Assign a doctor</text>
    <text x="60" y="240">• Free revisit within 15 days,</text>
    <text x="74" y="262">else collect Cash / Online fee</text>
    <text x="60" y="288">• Send to doctor's queue</text>

    <!-- 2 Doctor -->
    <rect x="330" y="80" width="250" height="230" rx="14" fill="#ffffff" stroke="#d6e4e0"/>
    <rect x="330" y="80" width="250" height="52" rx="14" fill="#2a8fd6"/><rect x="330" y="118" width="250" height="14" fill="#2a8fd6"/>
    <text x="455" y="113" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">② Doctor</text>
    <text x="350" y="162">• Personal waiting queue</text>
    <text x="350" y="188">• View past consultations</text>
    <text x="350" y="214">• Diagnosis + notes</text>
    <text x="350" y="240">• Prescribe from live</text>
    <text x="364" y="262">medicine catalogue w/ qty</text>
    <text x="350" y="288">• Send to pharmacy</text>

    <!-- 3 Pharmacy -->
    <rect x="620" y="80" width="250" height="230" rx="14" fill="#ffffff" stroke="#d6e4e0"/>
    <rect x="620" y="80" width="250" height="52" rx="14" fill="#e59a1b"/><rect x="620" y="118" width="250" height="14" fill="#e59a1b"/>
    <text x="745" y="113" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">③ Pharmacist</text>
    <text x="640" y="162">• See prescription details</text>
    <text x="640" y="188">• Build bill, edit qty/price</text>
    <text x="640" y="214">• Pay via Cash / UPI / Card</text>
    <text x="640" y="240">• One-click PDF invoice</text>
    <text x="640" y="266">• Manage medicine stock</text>

    <!-- 4 Admin -->
    <rect x="910" y="80" width="250" height="230" rx="14" fill="#ffffff" stroke="#d6e4e0"/>
    <rect x="910" y="80" width="250" height="52" rx="14" fill="#7a5bd6"/><rect x="910" y="118" width="250" height="14" fill="#7a5bd6"/>
    <text x="1035" y="113" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">④ Admin</text>
    <text x="930" y="162">• Total OPs</text>
    <text x="930" y="188">• OP revenue (today)</text>
    <text x="930" y="214">• Pharmacy revenue (today)</text>
    <text x="930" y="240">• Daily total revenue</text>
    <text x="930" y="266">• Paginated patient history</text>
  </g>

  <!-- arrows -->
  <g stroke="#5b6b73" stroke-width="2.5" marker-end="url(#arr)">
    <line x1="292" y1="195" x2="326" y2="195"/>
    <line x1="582" y1="195" x2="616" y2="195"/>
    <line x1="872" y1="195" x2="906" y2="195"/>
  </g>

  <!-- status bar -->
  <text x="600" y="352" text-anchor="middle" font-size="15" font-weight="600" fill="#5b6b73">Visit status lifecycle</text>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="270" y="368" width="130" height="36" rx="18" fill="#dcebfb"/><text x="335" y="391" fill="#1f6fb8">NEW</text>
    <rect x="440" y="368" width="130" height="36" rx="18" fill="#fdf0d5"/><text x="505" y="391" fill="#a8700f">WAITING</text>
    <rect x="610" y="368" width="150" height="36" rx="18" fill="#e9e2fb"/><text x="685" y="391" fill="#5a3fb0">IN_PROGRESS</text>
    <rect x="800" y="368" width="140" height="36" rx="18" fill="#d9f3e3"/><text x="870" y="391" fill="#1d8a4b">COMPLETED</text>
  </g>
  <g stroke="#9aa8ae" stroke-width="2" marker-end="url(#arr)">
    <line x1="402" y1="386" x2="436" y2="386"/>
    <line x1="572" y1="386" x2="606" y2="386"/>
    <line x1="762" y1="386" x2="796" y2="386"/>
  </g>
</svg>

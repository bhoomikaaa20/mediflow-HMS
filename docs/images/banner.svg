<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f7f6d"/>
      <stop offset="1" stop-color="#2f9e85"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#dots)"/>

  <!-- logo -->
  <rect x="70" y="92" width="96" height="96" rx="22" fill="#ffffff"/>
  <polyline points="84,142 108,142 120,112 136,170 148,142 152,142" fill="none" stroke="#2f9e85" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="196" y="140" font-size="58" font-weight="700" fill="#ffffff">MediFlow HMS</text>
  <text x="198" y="182" font-size="24" fill="#d8f3ec">Role-based Hospital OP &amp; Pharmacy Management System</text>
  <text x="198" y="226" font-size="17" fill="#bfe9de">Reception  →  Doctor  →  Pharmacy  →  Billing  →  Admin Analytics</text>

  <!-- tech chips -->
  <g font-size="15" font-weight="600" fill="#1f7f6d">
    <rect x="198" y="248" width="76" height="30" rx="15" fill="#ffffff"/><text x="236" y="268" text-anchor="middle">React</text>
    <rect x="284" y="248" width="104" height="30" rx="15" fill="#ffffff"/><text x="336" y="268" text-anchor="middle">TypeScript</text>
    <rect x="398" y="248" width="88" height="30" rx="15" fill="#ffffff"/><text x="442" y="268" text-anchor="middle">Node.js</text>
    <rect x="496" y="248" width="88" height="30" rx="15" fill="#ffffff"/><text x="540" y="268" text-anchor="middle">Express</text>
    <rect x="594" y="248" width="100" height="30" rx="15" fill="#ffffff"/><text x="644" y="268" text-anchor="middle">MongoDB</text>
    <rect x="704" y="248" width="60" height="30" rx="15" fill="#ffffff"/><text x="734" y="268" text-anchor="middle">JWT</text>
  </g>

  <!-- decorative cross -->
  <g opacity="0.16" fill="#ffffff">
    <rect x="975" y="60" width="70" height="200" rx="14"/>
    <rect x="910" y="125" width="200" height="70" rx="14"/>
  </g>
</svg>
